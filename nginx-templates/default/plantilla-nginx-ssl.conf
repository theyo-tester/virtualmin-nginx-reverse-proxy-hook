server {
    listen @PUBLIC_SSL_IP@:@PUBLIC_SSL_PORT@ ssl http2;
    server_name @SERVER_NAME@;
    root @WEB_ROOT_PATH@;

    client_max_body_size 0;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_certificate @SSL_CERTIFICATE@;
    ssl_certificate_key @SSL_CERTIFICATE_KEY@;

    access_log @ACCESS_LOG_FILE@;
    error_log @ERROR_LOG_FILE@;

    # Static contents with fallback to Apache
    location ~* \.(jpg|jpeg|gif|png|ico|css|zip|tgz|gz|rar|bz2|doc|xls|exe|pdf|ppt|txt|tar|mid|midi|wav|bmp|rtf|js|svg|webp|woff|woff2)$ {
        expires max;
        try_files $uri @apache;
    }

    location / {
        proxy_pass http://@APACHE_NON_SSL_IP@:@APACHE_NON_SSL_PORT@;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location @apache {
        proxy_pass http://@APACHE_NON_SSL_IP@:@APACHE_NON_SSL_PORT@;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
